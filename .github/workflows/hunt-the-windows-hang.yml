# Throwaway: sample the Windows hang of test-issue-127 many times in one
# job, now that the harness keeps standard error (#1448), and split the two
# candidate causes in the same run. Delete once issue #1449 is closed.
#
# The hang is intermittent -- roughly every other Windows job since #1445 --
# so one CI run says little. This runs the single failing test repeatedly,
# under the interpolating solver `detect` picks (MathSAT, since #1445 put it
# on the Windows runners) and under the one it picked before (`Z3qe`). What
# it is after is the first report of the hang that carries standard error:
#
#   - no output at all past the analysis header: the supervisor never
#     reached the timeout check of its polling loop, which on Windows is
#     the only wall clock there is;
#   - "Kind 2 did not exit in time, terminating.": the teardown wedged and
#     the last resort fired, so #1450 is the fix;
#   - the timeout banner but no exit: the teardown wedged after it.
name: Verify the engine cap

on:
  workflow_dispatch:
  push:
    branches: [ verify-the-engine-cap ]

env:
  Z3_VERSION: "4.15.3"
  MATHSAT_VERSION: "5.6.17"
  # Attempts per interpolating solver
  ROUNDS: "3"

jobs:
  hunt:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Build Kind 2
      uses: ./.github/actions/build-kind2
      with:
        ocaml-version: 5.5.0

    - name: Cache SMT solvers
      id: cache-solvers
      uses: actions/cache@v6
      with:
        path: solver-bin
        key: smt-solvers-windows-x86_64-z3-${{ env.Z3_VERSION }}-mathsat-${{ env.MATHSAT_VERSION }}

    - name: Download SMT solvers (on cache miss)
      if: steps.cache-solvers.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p solver-bin
        Z3_DIR=z3-${Z3_VERSION}-x64-win
        MS_DIR=mathsat-${MATHSAT_VERSION}-win64
        curl -sSL -o z3.zip "https://github.com/Z3Prover/z3/releases/download/z3-${Z3_VERSION}/${Z3_DIR}.zip"
        unzip -q z3.zip
        curl -sSL -o mathsat.zip "https://mathsat.fbk.eu/release/${MS_DIR}.zip"
        unzip -q mathsat.zip
        cp "$Z3_DIR"/bin/z3.exe "$Z3_DIR"/bin/*.dll solver-bin/
        cp "$MS_DIR"/bin/mathsat.exe "$MS_DIR"/bin/*.dll solver-bin/

    - name: Install SMT solvers
      shell: bash
      run: |
        set -euo pipefail
        chmod +x solver-bin/*
        echo "${GITHUB_WORKSPACE}\\solver-bin" >> $GITHUB_PATH

    - name: Check the solvers run
      shell: bash
      run: |
        set -euo pipefail
        z3 --version
        mathsat -version | head -1

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Sample the hang
      shell: bash
      run: |
        # Never fail the job: the report is the point, and a run that hangs
        # is the result we are here for.
        set -u
        python - <<'PY'
        import csv, os, subprocess, threading, time
        from subprocess import PIPE, STDOUT, DEVNULL, Popen

        kind2 = os.path.join("bin", "kind2.exe")
        lus = os.path.join("tests", "regression", "falsifiable", "test-issue-127.lus")
        timeout_s = 20
        budget = 240
        rounds = int(os.environ.get("ROUNDS", "3"))
        base = [kind2, "--timeout", str(timeout_s), "--color", "false",
                "--check_subproperties", "true", "--check_sat_assume", "false",
                "--slice_nodes", "on"]

        print(f"runner reports {os.cpu_count()} CPUs", flush=True)

        # System-wide counters for the whole job, one sampler rather than one
        # per query, so the measurement does not add the load it measures.
        counters = ["\\System\\Processor Queue Length",
                    "\\Processor(_Total)\\% Processor Time",
                    "\\Memory\\Available MBytes",
                    "\\Memory\\Pages/sec",
                    "\\System\\Processes"]
        perf = None
        try:
            perf = Popen(["typeperf", *counters, "-si", "1", "-o", "counters.csv", "-y"],
                         stdout=DEVNULL, stderr=DEVNULL)
        except OSError as e:
            print(f"typeperf unavailable: {e}", flush=True)

        def attempt(label, extra, n):
            cmd = base + extra + [lus]
            t0 = time.time()
            proc = Popen(cmd, stdout=PIPE, stderr=STDOUT, bufsize=1,
                         universal_newlines=True, errors="replace")
            lines = []
            def pump():
                for line in proc.stdout:
                    lines.append((time.time() - t0, line.rstrip()))
            th = threading.Thread(target=pump, daemon=True)
            th.start()
            try:
                proc.wait(timeout=budget)
                hung = False
            except subprocess.TimeoutExpired:
                hung = True
                subprocess.run(["taskkill", "/F", "/T", "/PID", str(proc.pid)],
                               capture_output=True)
                proc.kill()
            th.join(timeout=30)
            dt = time.time() - t0
            summary = [l for _, l in lines if l.startswith("PROBE stalled")]
            print(f"[{label} {n}] {'HUNG' if hung else 'exit ' + str(proc.returncode)}"
                  f" after {dt:.0f}s  |  {summary[-1] if summary else 'no stall summary'}",
                  flush=True)
            for at, line in lines:
                if "ticker-gap" in line or "engines at once" in line or "Not run:" in line:
                    print(f"    {at:7.1f}s | {line.split('PROBE ',1)[-1]}", flush=True)

        # The whole engine set, as CI runs it, against a pair of engines.
        # If the stalls are oversubscription, the share of a run spent
        # stalled should fall with the number of domains and solvers.
        # BMC alone falsifies this test in a second, so an arm holding it
        # never runs long enough to stall and says nothing about the rate.
        # These three all run to the timeout instead, so only the number of
        # domains and solvers differs.
        # What CI does today against what the cap does on this machine.
        # Same engines are enabled in both; the cap only bounds how many
        # run at once, so a difference is the cap's doing.
        arms = (("uncapped", ["--max_engines", "99"]),
                ("auto-cap", []))
        for label, extra in arms:
            for n in range(1, rounds + 1):
                attempt(label, extra, n)

        if perf is not None:
            perf.terminate()
            try: perf.wait(timeout=15)
            except subprocess.TimeoutExpired: perf.kill()
            print("=== system counters over the whole job ===", flush=True)
            try:
                with open("counters.csv", newline="", errors="replace") as f:
                    rows = list(csv.reader(f))
                head, data = rows[0][1:], rows[1:]
                cols = [[] for _ in head]
                for r in data:
                    for i, v in enumerate(r[1:]):
                        try: cols[i].append(float(v))
                        except (ValueError, IndexError): pass
                for name, vals in zip(head, cols):
                    if vals:
                        print(f"  {name}: max {max(vals):.1f}  mean {sum(vals)/len(vals):.1f}"
                              f"  min {min(vals):.1f}  ({len(vals)} samples)", flush=True)
            except OSError as e:
                print(f"  could not read counters.csv: {e}", flush=True)
        PY
