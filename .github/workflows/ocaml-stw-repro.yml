# Throwaway: does OCaml stop running when busy domains outnumber the
# cores, on Windows and not elsewhere? Nothing of Kind 2 is involved --
# one file, no libraries, no subprocesses. Delete once #1449 is closed.
name: Reproduce the OCaml stall

on:
  workflow_dispatch:
  push:
    branches: [ ocaml-stw-repro ]

jobs:
  stall:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6

    - name: Set up OCaml
      uses: ocaml/setup-ocaml@v3
      with:
        ocaml-compiler: 5.5.0

    - name: Build the reproducer
      shell: bash
      run: |
        set -euo pipefail
        cd ocaml-stw-repro
        # setup-ocaml puts the compiler in an opam switch, and nothing
        # is on PATH without asking opam for its environment.
        opam exec -- ocamlopt -version
        opam exec -- ocamlopt -I +unix -I +threads unix.cmxa threads.cmxa \
          yield_repro.ml -o yield_repro.exe

    # The threads of one domain take turns under one master lock, so
    # this contends whatever the core count is. Nothing here is
    # oversubscribed.
    - name: Do the threads of a domain get their turn
      shell: bash
      run: |
        set -u
        cd ocaml-stw-repro
        # Bounded, so that a thread which never gets its turn cannot
        # hang the job, and announced before each run, so that the arm
        # it happens on is named rather than inferred.
        #
        # Not `timeout`: it is absent on macOS, where it reported exit
        # 127 for all twelve arms and produced no data at all.
        bounded() {
          local secs=$1 ; shift
          "$@" & local pid=$!
          ( sleep "$secs" ; kill -9 "$pid" 2>/dev/null ) & local killer=$!
          wait "$pid" ; local rc=$?
          kill "$killer" 2>/dev/null
          wait "$killer" 2>/dev/null
          return $rc
        }

        for mode in busy yield alloc ; do
          for w in 0 1 2 4 ; do
            echo "== $mode workers=$w (expect ~8s) =="
            bounded 60 opam exec -- ./yield_repro.exe $mode $w 8 \
              || echo "   NO RESULT: killed after 60s or exit $?"
          done
        done

    # The same binary, launched from PowerShell: no Cygwin shell, no
    # `opam exec`, nothing of the CI environment between the runner and
    # the program. If it hangs here too, the environment is not what is
    # hanging it.
    #
    # Elapsed time is printed so that a program which fails to start --
    # a missing DLL, say -- is not read as one that never finished.
    - name: The same binary, outside Cygwin and opam
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Set-Location ocaml-stw-repro
        foreach ($arm in @(@('busy',1), @('alloc',1), @('yield',1), @('busy',0))) {
          $mode = $arm[0] ; $w = $arm[1]
          Write-Host "== $mode workers=$w (expect ~8s) =="
          $clock = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process -FilePath .\yield_repro.exe -ArgumentList $mode,$w,8 `
                 -PassThru -NoNewWindow
          if ($p.WaitForExit(60000)) {
            $clock.Stop()
            Write-Host ("   exit {0} after {1:N1}s" -f $p.ExitCode, $clock.Elapsed.TotalSeconds)
          } else {
            $clock.Stop()
            $p.Kill()
            Write-Host "   NO RESULT: still running at 60s"
          }
        }
