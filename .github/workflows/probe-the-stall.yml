# Throwaway: does Kind 2 still stall on Windows with OCaml 5.5.1, and
# is it one domain or the whole process? Delete when the question is
# answered.
#
# Two tickers are built into this branch: one is a thread of the
# supervisor's own domain, one has a domain to itself. Which of them
# goes quiet says whether the runtime lock of one domain is held, or
# nothing anywhere is running. The supervisor also reports any
# iteration of its polling loop that takes over a second, since that
# loop is the only thing that looks at the wall clock on Windows.
name: Probe the stall on 5.5.1

on:
  workflow_dispatch:
  push:
    branches: [ probe-the-stall-on-551 ]

env:
  Z3_VERSION: "4.15.3"
  MATHSAT_VERSION: "5.6.17"
  ROUNDS: "2"

jobs:
  probe:
    # The delay overshoot has only ever been measured on Windows, and
    # the synthetic tests do not reproduce it anywhere, so they cannot
    # clear the other platforms either. Same instrumented build, same
    # model, three runners.
    #
    # Only Windows can show a late *timeout*: elsewhere SIGALRM raises
    # it and the loop's cadence does not come into it. What the other
    # two are here for is the PROBE lines about `Thread.delay`.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6

    - name: Build Kind 2
      uses: ./.github/actions/build-kind2
      with:
        ocaml-version: 5.5.1

    - name: Cache SMT solvers
      id: cache-solvers
      uses: actions/cache@v6
      with:
        path: solver-bin
        key: smt-solvers-${{ matrix.name }}-z3-${{ env.Z3_VERSION }}-mathsat-${{ env.MATHSAT_VERSION }}

    - name: Download SMT solvers (on cache miss)
      if: steps.cache-solvers.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p solver-bin
        case "${{ matrix.name }}" in
          linux-x86_64)   Z3_DIR=z3-${Z3_VERSION}-x64-glibc-2.39   ; MS_DIR=mathsat-${MATHSAT_VERSION}-linux-x86_64  ;;
          macos-arm64)    Z3_DIR=z3-${Z3_VERSION}-arm64-osx-13.7.6 ; MS_DIR=mathsat-${MATHSAT_VERSION}-macos         ;;
          windows-x86_64) Z3_DIR=z3-${Z3_VERSION}-x64-win          ; MS_DIR=mathsat-${MATHSAT_VERSION}-win64         ;;
        esac
        curl -sSL -o z3.zip "https://github.com/Z3Prover/z3/releases/download/z3-${Z3_VERSION}/${Z3_DIR}.zip"
        unzip -q z3.zip
        if [[ "${{ runner.os }}" == "Windows" ]]; then
          curl -sSL -o mathsat.zip "https://mathsat.fbk.eu/release/${MS_DIR}.zip"
          unzip -q mathsat.zip
          cp "$Z3_DIR"/bin/z3.exe "$Z3_DIR"/bin/*.dll solver-bin/
          cp "$MS_DIR"/bin/mathsat.exe "$MS_DIR"/bin/*.dll solver-bin/
        else
          curl -sSL -o mathsat.tar.gz "https://mathsat.fbk.eu/release/${MS_DIR}.tar.gz"
          tar xzf mathsat.tar.gz
          cp "$Z3_DIR/bin/z3" solver-bin/
          cp "$MS_DIR/bin/mathsat" solver-bin/
        fi

    # As in kind2-ci: the macOS MathSAT loads GMP from the MacPorts path
    # it was linked against, and the runners carry Homebrew.
    - name: Give MathSAT the GMP it links against (macOS)
      if: runner.os == 'macOS'
      run: |
        set -euo pipefail
        brew install gmp
        sudo mkdir -p /opt/local/lib
        sudo ln -sf "$(brew --prefix gmp)/lib/libgmp.10.dylib" /opt/local/lib/libgmp.10.dylib

    - name: Install SMT solvers
      shell: bash
      run: |
        set -euo pipefail
        chmod +x solver-bin/*
        if [[ "${{ runner.os }}" == "Windows" ]]; then
          # A native path, since kind2.exe reads it and not only bash
          echo "${GITHUB_WORKSPACE}\\solver-bin" >> $GITHUB_PATH
        else
          sudo cp solver-bin/z3 solver-bin/mathsat /usr/local/bin/
        fi

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Sample the failing test
      shell: bash
      run: |
        set -u
        uv run --with psutil python - <<'PY'
        import os, subprocess, threading, time
        import psutil
        from subprocess import PIPE, STDOUT, Popen

        kind2 = os.path.join("bin", "kind2.exe" if os.name == "nt" else "kind2")
        lus = os.path.join("tests", "regression", "falsifiable", "test-issue-127.lus")
        # Exactly what the harness runs, and its budget.
        base = [kind2, "--timeout", "84", "--color", "false",
                "--check_subproperties", "true", "--check_sat_assume", "false",
                "--slice_nodes", "on"]
        budget = 204
        rounds = int(os.environ.get("ROUNDS", "4"))

        print(f"runner reports {os.cpu_count()} CPUs", flush=True)

        def attempt(n, arm="default", extra_env=None, extra_args=None):
            t0 = time.time()
            env = dict(os.environ)
            env.update(extra_env or {})
            proc = Popen(base + (extra_args or []) + [lus],
                         stdout=PIPE, stderr=STDOUT, bufsize=1,
                         env=env,
                         universal_newlines=True, errors="replace")
            lines, samples = [], []

            def pump():
                for line in proc.stdout:
                    lines.append((time.time() - t0, line.rstrip()))
            threading.Thread(target=pump, daemon=True).start()

            def sample():
                me = psutil.Process(proc.pid)
                try:
                    c0 = me.cpu_times() ; prev = c0.user + c0.system
                except psutil.Error:
                    prev = 0.0
                prev_kids = {}
                while proc.poll() is None:
                    time.sleep(1.0)
                    at = time.time() - t0
                    try:
                        c = me.cpu_times() ; cur = c.user + c.system
                        threads = me.num_threads()
                    except psutil.Error:
                        break
                    kids, cur_kids = 0.0, {}
                    for k in me.children(recursive=True):
                        try:
                            kc = k.cpu_times() ; tot = kc.user + kc.system
                            cur_kids[k.pid] = tot
                            kids += max(0.0, tot - prev_kids.get(k.pid, 0.0))
                        except psutil.Error:
                            pass
                    samples.append((at, cur - prev, kids, len(cur_kids), threads))
                    prev, prev_kids = cur, cur_kids
            threading.Thread(target=sample, daemon=True).start()

            try:
                proc.wait(timeout=budget) ; killed = False
            except subprocess.TimeoutExpired:
                killed = True
                if os.name == "nt":
                    subprocess.run(["taskkill", "/F", "/T", "/PID", str(proc.pid)],
                                   capture_output=True)
                else:
                    # Kind 2's solvers are its children; take the tree.
                    try:
                        for kid in psutil.Process(proc.pid).children(recursive=True):
                            kid.kill()
                    except psutil.Error:
                        pass
                proc.kill()
            time.sleep(1.0)
            dt = time.time() - t0
            print(f"\n[{arm} run {n}] "
                  f"{'KILLED at budget' if killed else 'exit ' + str(proc.returncode)} after {dt:.0f}s",
                  flush=True)

            # What the run itself said, and when.
            for at, line in lines:
                if "PROBE" in line:
                    print(f"    {at:6.1f}s | {line.split('PROBE ',1)[-1]}", flush=True)
            said = [ (at, l) for at, l in lines if "Timeout" in l or "timeout" in l ]
            for at, l in said[:3]:
                print(f"    {at:6.1f}s | said: {l.strip()}", flush=True)
            last = lines[-1] if lines else None
            if last:
                print(f"    last line at {last[0]:.1f}s: {last[1][:90]}", flush=True)

            # Who held the CPU while it was quiet.
            quiet = [s for s in samples if s[1] < 0.2]
            print(f"    samples: {len(samples)}, of which under 0.2 core-seconds: {len(quiet)}",
                  flush=True)
            if samples:
                worst = max(samples, key=lambda s: s[1])
                print(f"    busiest second at {worst[0]:.0f}s: Kind 2 {worst[1]:.2f} cores "
                      f"across {worst[4]} threads, {worst[3]} solvers {worst[2]:.2f} cores",
                      flush=True)
                tail = samples[-5:]
                for at, k2, slv, nk, th in tail:
                    print(f"    at {at:6.0f}s: Kind 2 {k2:.2f} cores, {nk} solvers {slv:.2f} cores, {th} threads",
                          flush=True)

        # Does the cost live in the collections themselves?
        #
        # The same call does ~200 minor collections whatever the
        # platform, and takes 1.5s on Linux against up to 175s here.
        # Every minor collection in OCaml 5 stops every domain, and
        # there are eleven of them, so if a rendezvous is what is
        # expensive, making collections rarer should take most of the
        # time away with them. A larger minor heap is how to ask.
        #
        # The number to watch is seconds per collection, not seconds:
        # if the rendezvous is the cost, that stays flat while the
        # count and the total fall together.
        #
        # An earlier attempt at this comparison was confounded -- every
        # large-heap run found a counterexample and no small-heap run
        # did, so the arms were not doing the same work. Hence the exit
        # code is printed with each run, and arms are only comparable
        # where it matches.
        # KIND2_PROBE_MINOR_HEAP, not OCAMLRUNPARAM: `engineDomains.ml`
        # assigns the minor heap size itself, in the supervisor and again
        # in every engine domain, so the environment variable the runtime
        # reads is overwritten before it can matter. Sizes are in words:
        # 262144 is the runtime's own default, 1048576 what Kind 2 ships,
        # 4194304 four times that.
        # 4M halved the Windows time against the 1M that ships, with the
        # same verdict either way, and changed nothing on Linux or
        # macOS. Does it keep halving, or is there a floor? A floor
        # would say part of the cost is not in the collections at all.
        #
        # 256k is dropped: it timed out, so it did different work and
        # was comparable to nothing.
        # Cut the failing program down rather than build a stand-in up.
        # Four synthetic guesses have now come back clean, so the
        # ingredient is one I keep failing to pick; the failing run is
        # in hand, and shrinking it cannot miss what building up does.
        #
        # The signal is the presence of multi-second freezes, not the
        # runtime: these arms do different amounts of work by design and
        # their wall clocks are not comparable to each other.
        #
        # Every arm keeps the shipped 1M minor heap, since that is where
        # the freezes are frequent.
        # Every arm so far has confounded engine count with run
        # length: fewer engines settle the properties sooner, so they
        # run for less time, so they see fewer freezes, and a zero
        # cannot be told from a short run. That voided one headline
        # already.
        #
        # This model settles nothing in any configuration -- each
        # property is false about a million steps in -- so every arm
        # below runs the full timeout and freeze counts are directly
        # comparable for the first time.
        #
        # The question it can finally ask: does the freeze simply need
        # more busy domains than the machine has cores? The runner has
        # four. Nothing else varies.
        lus = os.path.join("tests", "probe-nothing-settles.lus")
        base = [kind2, "--timeout", "60", "--color", "false"]
        budget = 150
        cuts = (
          ("1 engine  (BMC)", ["--enable", "BMC"]),
          ("2 engines (BMC IND)", ["--enable", "BMC", "--enable", "IND"]),
          ("3 engines (+IND2)", ["--enable", "BMC", "--enable", "IND",
                                 "--enable", "IND2"]),
          ("4 engines (+IC3QE)", ["--enable", "BMC", "--enable", "IND",
                                  "--enable", "IND2", "--enable", "IC3QE"]),
          ("6 engines (+INVGEN, INVGENOS)",
           ["--enable", "BMC", "--enable", "IND", "--enable", "IND2",
            "--enable", "IC3QE", "--enable", "INVGEN", "--enable", "INVGENOS"]),
          ("everything, whatever that is", []),
        )
        for arm, extra in cuts:
            print(f"\n########## {arm} ##########", flush=True)
            for n in range(1, rounds + 1):
                attempt(n, arm, {"KIND2_PROBE_MINOR_HEAP": "1048576"}, extra)
        PY
